<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1.5rem; color: #18181b; }
    section { border: 1px solid #e4e4e7; border-radius: .75rem; padding: 1.25rem; margin-top: 2rem; }
    ul { padding: 0; list-style: none; }
    li { display: flex; gap: .75rem; align-items: center; margin: .5rem 0; }
    .host { font-family: ui-monospace, monospace; }
    .badge { border-radius: .25rem; padding: 0 .5rem; background: #fef3c7; }
    .badge.active { background: #dcfce7; }
    .alert { color: #b91c1c; }
    .muted { color: #71717a; }
    button.link { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font: inherit; }
    form.inline { margin: 0; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
