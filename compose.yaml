# docker compose up                       app + SaaS Custom Domains mock
# DOMAINS_PROVIDER=caddy docker compose --profile diy up
#                                         app + your own Caddy instead
services:
  app:
    build: .
    ports: ["${APP_PORT:-3000}:3000"]
    environment:
      # "app" is how the mock (webhooks) and Caddy reach this container.
      APP_HOSTS: localhost,app
      APP_DOMAIN: helpdock.app
      DOMAINS_PROVIDER: ${DOMAINS_PROVIDER:-saascustomdomains}
      SCD_API_URL: http://scd-mock:4010
      SCD_API_TOKEN: scd_test_token
      SCD_ACCOUNT_UUID: acc_local
      SCD_UPSTREAM_UUID: upstream_local
      PROXY_AUTH_TOKEN: local_proxy_token
      SCD_WEBHOOK_TOKEN: local_webhook_token
    volumes: [data:/app/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/up')"]
      interval: 2s
      retries: 30

  # Stands in for SaaS Custom Domains: the API on :4010 and the proxy
  # on port 80, so http://anything.localhost reaches your app the way
  # a customer's domain would.
  scd-mock:
    image: ghcr.io/saas-custom-domains/scd-mock:latest
    ports:
      - "${SCD_MOCK_API_PORT:-4010}:4010"
      - "${SCD_MOCK_PROXY_PORT:-80}:4080"
    environment:
      SCD_MOCK_UPSTREAM_HOST: app
      SCD_MOCK_UPSTREAM_PORT: 3000
      SCD_MOCK_UPSTREAM_AUTH_TOKEN: local_proxy_token
      SCD_MOCK_WEBHOOK_URL: http://app:3000/webhooks/saascustomdomains
      SCD_MOCK_WEBHOOK_TOKEN: local_webhook_token
      # Test domains under .test count as pointed at the proxy.
      SCD_MOCK_VALID_HOSTS: "*.test"

  # Run the proxy yourself: Caddy with on-demand TLS.
  caddy:
    image: caddy:2
    profiles: [diy]
    ports: ["${CADDY_PORT:-443}:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  data:
  caddy:
