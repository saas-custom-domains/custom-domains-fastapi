[project]
name = "custom-domains-fastapi"
version = "0.1.0"
description = "Custom domains in a FastAPI app, with SaaS Custom Domains or your own Caddy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "dnspython>=2.9.0",
    "fastapi[standard]>=0.162.0",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.2",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
# Short lines so the code fits in the guide without scrolling.
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
